<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <canvas id="board" width="320" height="640"></canvas>
    <div class="sidebar">
      <h1>Tetris</h1>
      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Lines: <span id="lines">0</span></div>
      </div>
      <div class="next">
        <div class="label">Next</div>
        <canvas id="next" width="128" height="128"></canvas>
      </div>
      <div class="camera">
        <button id="startCam">启用摄像头控制</button>
        <div class="camRow">
          <video id="cam" playsinline muted class="hidden" width="256" height="144"></video>
          <canvas id="camDebug" width="256" height="144" class="hidden"></canvas>
        </div>
        <div class="hint">
          <div>手势控制：</div>
          <div>• 身体左右移动：控制方块</div>
          <div>• 右手举高：旋转</div>
          <div>• 左手快速下压：硬降</div>
          <div>• 键盘备用：← → ↑ ↓ Space P R</div>
          <div style="color: #ffaa00; margin-top: 4px;">如果摄像头无法使用，请使用键盘控制</div>
        </div>
      </div>
      <div class="controls">
        <div>← → 移动</div>
        <div>↑ 旋转</div>
        <div>↓ 软降</div>
        <div>Space 硬降</div>
        <div>P 暂停</div>
        <div>R 重开</div>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="dialog">
      <div class="title" id="overlayTitle">PAUSED</div>
      <div class="subtitle" id="overlayHint">Press P to Resume</div>
    </div>
  </div>

  <!-- MediaPipe Pose + camera utils (CDN with fallback) -->
  <script>
    // Load MediaPipe with error handling and fallback
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    
    async function loadMediaPipe() {
      try {
        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js');
        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js');
        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js');
        console.log('MediaPipe loaded successfully');
      } catch (error) {
        console.warn('Failed to load MediaPipe from CDN:', error);
        // Try alternative CDN
        try {
          await loadScript('https://unpkg.com/@mediapipe/camera_utils@0.3/camera_utils.js');
          await loadScript('https://unpkg.com/@mediapipe/pose@0.5/pose.js');
          await loadScript('https://unpkg.com/@mediapipe/drawing_utils@0.3/drawing_utils.js');
          console.log('MediaPipe loaded from alternative CDN');
        } catch (error2) {
          console.error('All CDN attempts failed:', error2);
          window.mediaPipeLoadError = true;
        }
      }
    }
    
    loadMediaPipe().then(() => {
      // Load main script after MediaPipe
      const script = document.createElement('script');
      script.src = 'main.js';
      document.head.appendChild(script);
    });
  </script>
</body>
# </html>
